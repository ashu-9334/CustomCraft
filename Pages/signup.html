<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CustomCraft - Create Account</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            <span>✦</span> CustomCraft
        </div>

        <div class="nav-links">

            <a href="../index.html">Home</a>

            <a href="../index.html#featured-products">Shop</a>

            <a href="customize.html">Customize</a>

            <a href="gift-box.html">Gift Boxes</a>

            <a href="track-order.html">Track Order</a>

        </div>

        <div class="nav-actions">

            <a
                href="wishlist.html"
                class="wishlist-link"
                title="Wishlist">
                ♡
            </a>

            <a
                href="cart.html"
                class="cart-link"
                title="Cart">
                🛒
            </a>

        </div>

    </nav>


    <section class="login-page">

        <div class="login-heading">

            <p>JOIN CUSTOMCRAFT</p>

            <h1>Create Your Account</h1>

            <span>
                Create an account to manage your orders and wishlist.
            </span>

        </div>


        <div class="login-container">

            <form class="login-form" id="signup-form">

                <h2>Sign Up</h2>

                <label>Full Name</label>

                <input
                    type="text"
                    id="signup-name"
                    placeholder="Enter your full name"
                    required>


                <label>Email Address</label>

                <input
                    type="email"
                    id="signup-email"
                    placeholder="Enter your email"
                    required>


                <label>Password</label>

                <input
                    type="password"
                    id="signup-password"
                    placeholder="Create a password"
                    required>


                <label>Confirm Password</label>

                <input
                    type="password"
                    id="signup-confirm-password"
                    placeholder="Confirm your password"
                    required>


                <button type="submit">
                    Create Account →
                </button>


                <p class="login-register-text">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </form>

        </div>

    </section>

    <script src="../js/signup.js"></script>

</body>

</html>
